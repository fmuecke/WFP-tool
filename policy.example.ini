[policy]
account=ClaudeSandbox
policy_version=1
proxy_port=8080

[wfp-allow]
; wfptool permits only these exact endpoints, then blocks all other attributed
; IPv4/IPv6 TCP and UDP connections for this account. ICMP is not managed.
; Syntax: IPv4 address:port=tcp|udp|tcp,udp; IPv6 [address]:port=tcp|udp|tcp,udp.
; Hostnames and wildcards belong in the proxy [allow] section below, not here.
127.0.0.1:8080=tcp
[::1]:8080=tcp

[allow]
api.anthropic.com=443
claude.ai=443
platform.claude.com=443
downloads.claude.ai=443
